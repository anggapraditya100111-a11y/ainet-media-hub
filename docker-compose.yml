name: ainet-media-hub

services:
  media-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: ainet-media-hub:0.1.1
    container_name: ainet-media-hub
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:8094"
    environment:
      NODE_ENV: production
      PORT: 8094
      APP_PEPPER: "${APP_PEPPER}"
      INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-Administrator}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      DEFAULT_APP_NAME: "${DEFAULT_APP_NAME:-AXINDO Media Hub}"
      DEFAULT_COMPANY_NAME: "${DEFAULT_COMPANY_NAME:-PT Axindo Infinitas Network}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_HOURS: "${SESSION_HOURS:-12}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      SEED_DEMO: "${SEED_DEMO:-false}"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - /DATA/AppData/media-hub/database:/app/data
      - /DATA/AppData/media-hub/uploads:/app/uploads
      - /DATA/AppData/media-hub/backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

x-casaos:
  id: com.axindo.media-hub
  main: media-hub
  index: /
  port_map: "8095"
  scheme: http
  title:
    en_US: AXINDO Media Hub
  tagline:
    en_US: Social media content workflow and shared brand library
  description:
    en_US: Internal media operations hub for AINET and IMAS.
  author: PT Axindo Infinitas Network
  developer: AINET
  category: Productivity
  architectures:
    - amd64
  version: "0.1.1"
  update_at: "2026-09-07"
