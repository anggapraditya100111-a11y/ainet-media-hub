name: ainet-media-hub

services:
  media-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: ainet-media-hub:0.3.3
    container_name: ainet-media-hub
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:8094"
    environment:
      NODE_ENV: production
      PORT: 8094
      APP_PEPPER: "${APP_PEPPER}"
      INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-Administrator}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      DEFAULT_APP_NAME: "${DEFAULT_APP_NAME:-AXINDO Media Hub}"
      DEFAULT_COMPANY_NAME: "${DEFAULT_COMPANY_NAME:-PT Axindo Infinitas Network}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://mediahub.axindo.my.id}"
      ACCESS_PORTAL_URL: "${ACCESS_PORTAL_URL:-https://akses.axindo.my.id}"
      ACCESS_PORTAL_INTERNAL_URL: "${ACCESS_PORTAL_INTERNAL_URL:-http://host.docker.internal:8096}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_HOURS: "${SESSION_HOURS:-12}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-50}"
      SEED_DEMO: "${SEED_DEMO:-false}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_POST_LOGOUT_REDIRECT_URI: "${OIDC_POST_LOGOUT_REDIRECT_URI:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_ALLOWED_EMAIL_DOMAINS: "${OIDC_ALLOWED_EMAIL_DOMAINS:-}"
      OIDC_AUTO_PROVISION: "${OIDC_AUTO_PROVISION:-true}"
      OIDC_ROLE_MAPPING_JSON: "${OIDC_ROLE_MAPPING_JSON:-}"
      LOCAL_PERSONAL_LOGIN_ENABLED: "${LOCAL_PERSONAL_LOGIN_ENABLED:-}"
      LOCAL_SUPER_ADMIN_ENABLED: "${LOCAL_SUPER_ADMIN_ENABLED:-true}"
      OIDC_ALLOW_INSECURE: "${OIDC_ALLOW_INSECURE:-false}"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - ${DATA_ROOT:-./runtime}/database:/app/data
      - ${DATA_ROOT:-./runtime}/uploads:/app/uploads
      - ${DATA_ROOT:-./runtime}/backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
